{% extends "base.html" %}

{% block content %}
<section class="login-panel" aria-labelledby="login-title">
    <div class="login-mark">
        <img src="/static/images/relaycat-logo.png" width="72" height="72" alt="">
        <h1 id="login-title">RelayCat</h1>
    </div>
    {% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack-form">
        <label for="password">管理员密码</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit" class="button button-primary button-block">登录</button>
    </form>
</section>
{% endblock %}
